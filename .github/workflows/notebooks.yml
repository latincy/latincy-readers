name: notebooks

# Validate that every demo notebook conforms to the nbformat schema, so a
# malformed notebook never reaches main and renders as "Invalid Notebook" on
# GitHub. This is intentionally lightweight: it installs only nbformat and
# does not import the package or download any models/corpora.

on:
  push:
    paths:
      - "notebooks/**"
      - "tests/test_notebooks.py"
      - ".github/workflows/notebooks.yml"
  pull_request:
    paths:
      - "notebooks/**"
      - "tests/test_notebooks.py"
      - ".github/workflows/notebooks.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbformat + pytest
        run: python -m pip install --upgrade nbformat pytest

      - name: Validate notebooks
        run: python -m pytest tests/test_notebooks.py -v
